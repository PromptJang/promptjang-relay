services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: promptjang
      POSTGRES_USER: promptjang
      POSTGRES_PASSWORD: ${PJ_POSTGRES_PASSWORD:-local_promptjang_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptjang -d promptjang"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - promptjang-postgres:/var/lib/postgresql/data

  promptjang:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://promptjang:${PJ_POSTGRES_PASSWORD:-local_promptjang_password}@postgres:5432/promptjang
      PJ_ADMIN_USERNAME: ${PJ_ADMIN_USERNAME:-admin}
      PJ_ADMIN_PASSWORD: ${PJ_ADMIN_PASSWORD:?Set PJ_ADMIN_PASSWORD}
      PJ_ENCRYPTION_KEY: ${PJ_ENCRYPTION_KEY:?Set PJ_ENCRYPTION_KEY}
      PJ_MAX_PAYLOAD_BYTES: ${PJ_MAX_PAYLOAD_BYTES:-1048576}
      PJ_RATE_LIMIT_PER_DESTINATION_PER_MINUTE: ${PJ_RATE_LIMIT_PER_DESTINATION_PER_MINUTE:-10000}
      PJ_EVENT_RETENTION_DAYS: ${PJ_EVENT_RETENTION_DAYS:-30}
      PJ_WORKER_CONCURRENCY: ${PJ_WORKER_CONCURRENCY:-8}
      PJ_DELIVERY_TIMEOUT_SECONDS: ${PJ_DELIVERY_TIMEOUT_SECONDS:-15}
      PJ_RETRY_DELAYS_SECONDS: ${PJ_RETRY_DELAYS_SECONDS:-60,120,240,480,960}
      PJ_STUCK_AFTER_SECONDS: ${PJ_STUCK_AFTER_SECONDS:-300}
      PJ_RESPONSE_BODY_BYTES: ${PJ_RESPONSE_BODY_BYTES:-10240}
      PJ_DB_MAX_CONNECTIONS: ${PJ_DB_MAX_CONNECTIONS:-20}
      PJ_SESSION_TTL_SECONDS: ${PJ_SESSION_TTL_SECONDS:-86400}
      PJ_DESTINATION_ALLOW_PRIVATE_CIDRS: ${PJ_DESTINATION_ALLOW_PRIVATE_CIDRS:-}
      PJ_ALLOW_INSECURE_HTTP: ${PJ_ALLOW_INSECURE_HTTP:-false}
      PJ_ALLOW_WEAK_PASSWORD: ${PJ_ALLOW_WEAK_PASSWORD:-false}
      PJ_OTEL_ENABLED: ${PJ_OTEL_ENABLED:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-promptjang-relay}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      RUST_LOG: ${RUST_LOG:-promptjang_relay=info,tower_http=info}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  promptjang-postgres:
